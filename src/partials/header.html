<!-- HEADER -->
<header id="site-header" class="group/header fixed inset-x-0 top-0 z-50 pt-3 pb-6 md:pt-[18px] md:pb-[34px] text-[#A3A3A3]">
  <div class="pointer-events-none absolute inset-x-0 top-0 -bottom-2.5 -z-20 bg-gradient-to-b from-[#0A0C10]/85 to-transparent"></div>
  <div class="pointer-events-none absolute inset-0 -z-10 opacity-0 transition-opacity duration-500 group-[.is-scrolled]/header:opacity-100 bg-gradient-to-b from-[#0A0C10]/95 via-[#0A0C10]/90 to-transparent backdrop-blur-lg [mask-image:linear-gradient(to_bottom,#000_62%,transparent)]"></div>

  <div class="mx-auto grid max-w-[1400px] grid-cols-[1fr_auto_1fr] items-center px-6 md:px-12">

    <a href="index.html" class="hidden lg:block justify-self-start relative py-1.5 font-serif text-[1.15rem] tracking-[0.14em] [font-variant:small-caps] transition-all duration-500 hover:text-[#E5E5E5] hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.3)] after:absolute after:inset-x-0 after:bottom-0 after:h-px after:origin-left after:scale-x-0 after:bg-[#A3A3A3] after:transition-transform after:duration-500 hover:after:scale-x-100">
      На главную
    </a>

    <a href="index.html" aria-label="inastralium — на главную" class="group col-start-2 row-start-1 flex flex-col items-center text-[#E5E5E5]">
      <span class="font-serif text-[1.5rem] font-light leading-none tracking-[0.1em] transition-all duration-500 md:text-[1.8rem] group-hover:text-white group-hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]">
        inastralium
      </span>
      <span class="mt-2.5 flex items-center gap-2 opacity-50 transition-opacity duration-500 group-hover:opacity-100" aria-hidden="true">
        <i class="block h-[3px] w-5 border-y border-t-[#A3A3A3]/50 border-b-[#A3A3A3]/20 md:w-[34px]"></i>
        <svg width="12" height="6" viewBox="0 0 24 12" fill="none" class="text-[#E5E5E5]">
          <circle cx="4" cy="6" r="1.5" fill="currentColor" />
          <circle cx="12" cy="6" r="1.5" fill="currentColor" />
          <circle cx="20" cy="6" r="1.5" fill="currentColor" />
        </svg>
        <i class="block h-[3px] w-5 border-y border-t-[#A3A3A3]/50 border-b-[#A3A3A3]/20 md:w-[34px]"></i>
      </span>
    </a>

    <button id="mobile-menu-btn"
            class="col-start-3 justify-self-end transition-colors text-[#A3A3A3] hover:text-white lg:hidden z-50 relative p-2"
            aria-label="Открыть меню">
      <svg id="menu-icon-open" class="w-6 h-6 block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-width="1" d="M4 8h16M4 16h16" />
      </svg>
      <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-width="1" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
</header>

  <div class="absolute bottom-5 flex flex-col items-center gap-6">

        <div class="absolute inset-0 bg-[#D4C4A8]/30 blur-xl rounded-full"></div>
        <div id="moon-icon-mobile" class="relative z-10 flex items-center justify-center w-10 h-10 text-[#F4E8D4] transition-all duration-300 drop-shadow-[0_0_15px_rgba(244,232,212,0.6)]"></div>
      </div>
      <div class="flex flex-col items-center leading-none">
        <span class="text-[0.6rem] tracking-[0.4em] uppercase font-serif text-[#D4C4A8]/70 mb-2">Луна</span>

    <span class="font-serif text-lg font-light tracking-[0.1em] text-white opacity-30">inastralium</span>
